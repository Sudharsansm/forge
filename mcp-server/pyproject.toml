[project]
name = "forge-mcp"
version = "0.2.0"
description = "Bitsophia Forge: MCP server + API for an AI app builder with live preview"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "pillow>=10.4",
]

[project.scripts]
forge-server = "forge_core.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
